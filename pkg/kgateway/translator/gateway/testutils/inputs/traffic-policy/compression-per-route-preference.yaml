# Three routes on the same Gateway (one filter chain) request different codec preference orders.
# Each must get its own ordered compressor filter set so no route's preference overrides another's;
# Envoy has no per-route tie-break override.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: example-gateway
spec:
  gatewayClassName: kgateway
  listeners:
  - protocol: HTTP
    port: 8080
    name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefer-brotli
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - "br.example.com"
  rules:
    - backendRefs:
        - name: example-svc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefer-gzip
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - "gz.example.com"
  rules:
    - backendRefs:
        - name: example-svc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefer-zstd
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - "zs.example.com"
  rules:
    - backendRefs:
        - name: example-svc
          port: 80
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: prefer-brotli
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prefer-brotli
  compression:
    responseCompression:
      libraries:
        - Brotli
        - Gzip
        - Zstd
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: prefer-gzip
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prefer-gzip
  compression:
    responseCompression:
      libraries:
        - Gzip
        - Zstd
        - Brotli
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: prefer-zstd
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prefer-zstd
  compression:
    responseCompression:
      libraries:
        - Zstd
        - Brotli
        - Gzip
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: test
  ports:
  - protocol: TCP
    port: 80
    targetPort: test
